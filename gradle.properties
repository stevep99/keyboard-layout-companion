# Project-wide Gradle settings.

android.useAndroidX=true
android.injected.testOnly=false
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# Bypass AGP 9.x incompatibility with the Kotlin Multiplatform plugin while keeping the
# legacy com.android.application DSL (required by Compose Multiplatform 1.12.0's AGP 9.1.0 requirement).
android.builtInKotlin=false
android.newDsl=false

# Increase Gradle JVM memory
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Increase memory for Kotlin compiler daemon
kotlin.daemon.jvmargs=-Xmx3g

